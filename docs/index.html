<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>学术知识库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/css/style.css">
  
  <!-- MathJax预配置 -->
  <script src="./assets/lib/mathjax.js"></script>
  <script src="./assets/js/mathjax-config.js"></script>
</head>
<body>
  <div id="global-controls">
    <button id="sidebar-toggle" class="control-btn">
      <span class="icon">📖</span>
    </button>
    <button id="back-to-top" class="control-btn">
      <span class="icon">↑</span>
    </button>
  </div>

  <div id="app"></div>

  <!-- 依赖库 -->
  <script src="./assets/lib/jquery.min.js"></script>
  <script src="./assets/lib/docsify.min.js"></script>
  <script src="./assets/lib/search.min.js"></script>
  
  <!-- 保留的核心功能 -->
  <script src="./assets/js/sidebar-toggle.js"></script>
  <script src="./assets/js/back-to-top.js"></script>

  <script>
    window.$docsify = {
      name: '学术知识库',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,  // 恢复默认层级
      search: {
        placeholder: '搜索学术文档',
        noData: '未找到相关结果'
      }
      // 移除所有插件配置
    }
  </script>
</body>
</html>
